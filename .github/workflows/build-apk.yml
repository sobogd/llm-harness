name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number N (tag app-<N>). Defaults to last + 1'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: v
        env:
          DISPATCH_N: ${{ inputs.version }}
          T: ${{ secrets.APP_AUTH_TOKEN }}
        run: |
          if [ -n "$DISPATCH_N" ]; then
            N="$DISPATCH_N"
          else
            max=$(git ls-remote --tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 'app-*' \
              | sed 's|.*refs/tags/app-||' | grep -E '^[0-9]+$' | sort -n | tail -1)
            N=$(( ${max:-0} + 1 ))
          fi
          if ! printf '%s' "$N" | grep -Eq '^[0-9]+$'; then
            echo "::error::release number N must be a positive integer (got: $N)"; exit 1
          fi
          if [ -z "$T" ]; then echo "::error::secret APP_AUTH_TOKEN is empty"; exit 1; fi
          echo "N=$N" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: android-actions/setup-android@v4

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: restore release keystore
        env:
          B64: ${{ secrets.LLMH_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/keys/release.keystore"
          ls -l "$RUNNER_TEMP/keys/release.keystore"

      - name: build apk
        env:
          APP_VERSION: ${{ steps.v.outputs.N }}
          SERVER_URL: ${{ secrets.APP_SERVER_URL || 'https://llm.iq-factura.com' }}
          UPDATE_BASE_URL: ${{ secrets.APP_UPDATE_BASE_URL || secrets.APP_SERVER_URL || 'https://llm.iq-factura.com' }}
          APP_AUTH_TOKEN: ${{ secrets.APP_AUTH_TOKEN }}
          LLMH_KEYSTORE_FILE: ${{ runner.temp }}/keys/release.keystore
          LLMH_KEYSTORE_PASS: ${{ secrets.LLMH_ANDROID_KEYSTORE_PASSWORD }}
          LLMH_KEY_ALIAS: ${{ vars.LLMH_ANDROID_KEY_ALIAS }}
          LLMH_KEY_PASS: ${{ secrets.LLMH_ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: |
          echo "==> flutter: version=$APP_VERSION  SERVER_URL=$SERVER_URL  UPDATE_BASE_URL=$UPDATE_BASE_URL  AUTH_TOKEN=<set>"
          flutter build apk --release \
            --dart-define=SERVER_URL="$SERVER_URL" \
            --dart-define=AUTH_TOKEN="$APP_AUTH_TOKEN" \
            --dart-define=UPDATE_BASE_URL="$UPDATE_BASE_URL" \
            --dart-define=APP_VERSION="$APP_VERSION"

      - name: rename artifact
        env:
          N: ${{ steps.v.outputs.N }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "app-${N}.apk"
          sha256sum "app-${N}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-*.apk

      - name: tag from dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          N: ${{ steps.v.outputs.N }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "app-${N}"
          git push origin "app-${N}"

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "app-${{ steps.v.outputs.N }}"
          name: "app-${{ steps.v.outputs.N }}"
          files: |
            app-${{ steps.v.outputs.N }}.apk
          generate_release_notes: true