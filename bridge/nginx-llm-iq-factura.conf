# /etc/nginx/sites-available/llm.iq-factura.conf -> sites-enabled
# llm.iq-factura.com -> loopback :18830 (llm-bridge, llm-harness/bridge/server.py)
# Единственный публичный вход в macc'овский llm-harness: наружу смотрит только
# этот vhost, дальше весь путь — loopback (мост -> туннель -> мак).

server {
    listen 80;
    listen [::]:80;
    server_name llm.iq-factura.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://llm.iq-factura.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm.iq-factura.com;

    ssl_certificate     /etc/letsencrypt/live/llm.iq-factura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.iq-factura.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:18830;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }
}
